name: Evidence CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check server tests
      - run: pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run check:js
      - run: npx playwright install --with-deps chromium
      - name: Browser end-to-end test
        shell: bash
        run: |
          export EVIDENCE_DATA_DIR="$(mktemp -d)"
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8177 > /tmp/evidence-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8177/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
