<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVIDENCE - 회원가입</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="auth.css">
<script src="auth.js" defer></script>
</head><body class="auth-page">
<main class="auth-card auth-card--signup" data-node-id="11:831">
<img class="auth-glyph" src="assets/auth/68af4.svg" alt="">
<header class="auth-heading"><h1>Camerica 회원가입</h1><p>계정을 생성하고 증거 관리 플랫폼을 이용해보세요.</p></header>
<form id="signup-form"><div class="auth-fields">
<div class="auth-field"><label for="name">Name <span>*</span></label><div class="auth-input"><img src="assets/auth/54964.svg" alt=""><input id="name" type="text" placeholder="Enter a value" autocomplete="name" maxlength="100" required></div></div>
<div class="auth-field"><label for="email">Email <span>*</span></label><div class="auth-input-row"><div class="auth-input"><img src="assets/auth/088ff.svg" alt=""><input id="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-verification-note" required></div><button id="send-verification-code" class="auth-button auth-button--verification" type="button">인증코드 보내기</button></div></div>
<div class="auth-field"><label for="verification-code">Email Verification Code <span>*</span></label><div class="auth-input-row"><div class="auth-input"><img src="assets/auth/e5373.svg" alt=""><input id="verification-code" type="text" placeholder="6자리 인증코드" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-describedby="email-verification-status" disabled required></div><button id="verify-email-code" class="auth-button auth-button--verification" type="button" disabled>확인</button></div><p id="email-verification-note" class="auth-field-note">현재는 화면 시연용이며, 실제 이메일은 발송되지 않습니다.</p><p id="email-verification-status" class="auth-field-status" role="status" aria-live="polite" aria-atomic="true"></p></div>
<div class="auth-field"><label for="password">Password <span>*</span></label><div class="auth-input"><img src="assets/auth/dac87.svg" alt=""><input id="password" type="password" placeholder="Enter your password" autocomplete="new-password" minlength="8" maxlength="16" aria-describedby="password-condition" required></div></div>
<div class="auth-strength"><div class="auth-strength-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p id="password-strength">비밀번호 강도: 보통</p><p id="password-condition">비밀번호는 8~16자이며, 영문·숫자·특수문자를 모두 포함해야 합니다.</p></div>
<div class="auth-field"><label for="password-confirm">Password Confirm <span>*</span></label><div class="auth-input"><img src="assets/auth/0af36.svg" alt=""><input id="password-confirm" type="password" placeholder="Enter your password again" autocomplete="new-password" required></div></div>
</div>
<label class="auth-agreement"><input id="signup-agreement" type="checkbox" required><span>이용약관 및 개인정보 처리방침에 동의합니다</span></label>
<div class="auth-actions"><a class="auth-button" href="login.html">로그인</a><button class="auth-button auth-button--primary" type="submit">가입하기</button></div>
</form><a class="auth-close" href="index.html" aria-label="회원가입 창 닫기"><img src="assets/auth/733d7.svg" alt=""></a></main></body></html>
