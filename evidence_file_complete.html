<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 증거 등록 완료 | EVIDENCE</title>
  <link rel="stylesheet" href="app.css">
  <script src="navigation.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="completion-shell">
    <header class="completion-header">
      <div class="completion-brand">EVIDENCE</div>
      <nav class="completion-nav" aria-label="주 메뉴">
        <span>증거 관리</span><span>수집 도구</span><span>감사 로그</span><span>내 계정</span>
      </nav>
    </header>
    <main class="completion-main">
      <div class="completion-breadcrumb">증거 관리 &gt; 증거 등록 &gt; 파일 증거 &gt; 등록 완료</div>
      <section class="completion-intro">
        <div class="completion-check" aria-hidden="true">✓</div>
        <div>
          <h1>파일 증거가 등록되었습니다.</h1>
          <p>원본 파일과 문서 정보, 메타데이터 및 무결성 기록이 함께 보존되었습니다.</p>
        </div>
      </section>
      <section class="completion-card" aria-label="등록된 증거 정보">
        <div class="completion-details">
          <div><span>증거 ID</span><strong>EV-20261008-001</strong></div>
          <div><span>파일</span><strong data-evidence-filename>contract_2026.pdf</strong></div>
          <div><span>SHA-256</span><strong>8b1a9953c4611296a827abf8c47804d7...21c6</strong></div>
          <div><span>수집 시간</span><strong>2026/10/08 14:21:09</strong></div>
        </div>
        <div class="completion-status">
          <span>처리 완료</span>
          <div><b>원본 파일 보존</b><b>파일 정보 추출</b><b>메타데이터 추출</b><b>SHA-256 생성</b><b>Chain of Custody 기록</b></div>
        </div>
      </section>
      <div class="completion-actions">
        <button type="button">증거 관리로 이동</button>
        <button type="button" class="primary">증거 상세보기</button>
      </div>
    </main>
  </div>
</body>
</html>
