<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVIDENCE - 프로필 정보 수정</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="account.css">
  <script src="navigation.js" defer></script>
  <script src="account.js" defer></script>
</head>
<body>
  <div class="account-shell">
    <header class="account-header">
      <a class="account-brand" href="index_home.html"><span class="account-brand__mark" aria-hidden="true"></span><span class="account-brand__name">EVIDENCE</span><span class="account-brand__detail">디지털 증거 플랫폼</span></a>
      <nav class="account-nav" aria-label="주 메뉴">
        <a href="Dashboard.html">대시보드</a><a href="evidence.html">증거 관리</a><a href="verification.html">검증</a><a href="report.html">보고서</a><a class="account-nav__mypage" href="mypage.html">My page</a>
      </nav>
    </header>
    <main class="account-main">
      <nav class="account-breadcrumb" aria-label="경로"><a href="mypage.html">My page</a><span>/</span><strong>프로필 정보 수정</strong></nav>
      <section class="account-card" aria-labelledby="profile-title">
        <div class="account-card__title"><span class="account-icon" aria-hidden="true">♙</span><h1 id="profile-title">프로필 정보 수정</h1></div>
        <p class="account-card__description">가입할 때 입력한 계정 정보를 확인하고 이름을 수정합니다.</p>
        <form id="profile-edit-form" class="account-form">
          <label class="account-field">이름<input name="name" type="text" required maxlength="100" autocomplete="name"></label>
          <label class="account-field">이메일<input name="email" type="email" autocomplete="email" readonly></label>
          <p class="account-help">이메일 변경은 현재 지원하지 않습니다.</p>
          <div class="account-actions"><a class="account-button" href="mypage.html">취소</a><button class="account-button account-button--primary" type="submit">저장</button></div>
        </form>
        <p class="account-status" data-account-status role="status" hidden></p>
      </section>
    </main>
  </div>
</body>
</html>
