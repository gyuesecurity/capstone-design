<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

<body class="layout-page page4-workspace registration-page">
<header class="workspace-sidebar">
  <a class="workspace-brand" href="index_home.html" aria-label="CredOc 서비스 홈">
    <img src="assets/brand/credoc-wordmark.svg" width="132" height="28" alt="CredOc">
    <span>디지털 증거 플랫폼</span>
  </a>
  <nav class="workspace-menu" aria-label="주 메뉴">
    <a href="Dashboard.html">대시보드</a>
    <a href="evidence.html" aria-current="location">증거 관리</a>
    <a href="verification.html">검증</a>
    <a href="report.html">보고서</a>
    <a href="mypage.html">My page</a>
  </nav>
</header>

  <div class="completion-shell layout-shell">
    <main class="completion-main">
      <nav class="completion-breadcrumb" aria-label="현재 위치">
        <a href="evidence.html">증거 관리</a><span aria-hidden="true">&gt;</span>

        <h2 id="completion-info">등록 정보</h2>
        <dl class="completion-details" data-completion-details></dl>
      </section>
      <div class="completion-actions">
        <button class="account-button" type="button" data-completion-detail disabled>증거 상세보기</button>
        <a class="account-button account-button--primary" href="evidence.html">증거 관리로 이동</a>
