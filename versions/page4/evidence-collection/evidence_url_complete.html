<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 수집 시연 결과 | CredOc</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="page4-workspace.css">
  <link rel="stylesheet" href="evidence-collection.css">
  <script src="app.js" defer></script>
</head>
<body class="layout-page page4-workspace registration-page">
<header class="workspace-sidebar">
  <a class="workspace-brand" href="index_home.html" aria-label="CredOc 서비스 홈">
    <img src="assets/brand/credoc-wordmark.svg" width="132" height="28" alt="CredOc">
    <span>디지털 증거 플랫폼</span>
  </a>
  <nav class="workspace-menu" aria-label="주 메뉴">
    <a href="Dashboard.html">대시보드</a>
    <a href="evidence.html" aria-current="location">증거 관리</a>
    <a href="verification.html">검증</a>
    <a href="report.html">보고서</a>
    <a href="mypage.html">My page</a>
  </nav>
</header>

  <div class="completion-shell layout-shell">
    <main class="completion-main">
      <nav class="completion-breadcrumb" aria-label="현재 위치">
        <a href="evidence.html">증거 관리</a><span aria-hidden="true">&gt;</span>
        <a href="chose_evidence.html">증거 등록</a><span aria-hidden="true">&gt;</span>
        <a href="evidence_url.html">URL 수집</a><span aria-hidden="true">&gt;</span>
        <span aria-current="page">시연 결과</span>
      </nav>
      <section class="completion-intro" data-state="demo" aria-labelledby="completion-title" aria-live="polite">
        <span class="completion-check" aria-hidden="true">i</span>
        <div>
          <h1 id="completion-title">URL 수집 시연 결과</h1>
          <p data-confirmed-url-summary>이 탭에서 확인한 주소가 없습니다.</p>
        </div>
      </section>
      <section class="completion-card" aria-labelledby="completion-info">
        <h2 id="completion-info">확인한 주소</h2>
        <dl class="completion-details">
          <div data-field="url"><dt>입력한 URL</dt><dd data-completion-url>입력 기록 없음</dd></div>
        </dl>
      </section>
      <div class="completion-actions">
        <a class="account-button" href="evidence_url.html">다른 주소 확인</a>
        <a class="account-button account-button--primary" href="evidence.html">증거 관리로 이동</a>
      </div>
    </main>
  </div>
</body>
</html>
