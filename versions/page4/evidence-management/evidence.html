<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>증거 관리 | CredOc</title>
  <link rel="stylesheet" href="app.css?v=evidence-list-1">
  <script src="navigation.js" defer></script>
  <script src="app.js?v=evidence-list-1" defer></script>
<link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="page4-workspace.css">
  <link rel="stylesheet" href="page4-details.css">
  <link rel="stylesheet" href="evidence-management.css">
</head>
<body class="layout-page page4-workspace evidence-library-page">
<header class="workspace-sidebar">
  <a class="workspace-brand" href="index_home.html" aria-label="CredOc 서비스 홈">
    <img src="assets/brand/credoc-wordmark.svg" width="132" height="28" alt="CredOc">
    <span>디지털 증거 플랫폼</span>
  </a>
  <nav class="workspace-menu" aria-label="주 메뉴">
    <a href="Dashboard.html">대시보드</a>
    <a href="evidence.html" aria-current="page">증거 관리</a>
    <a href="verification.html">검증</a>
    <a href="report.html">보고서</a>
    <a href="mypage.html">My page</a>
  </nav>
</header>
<main class="layout-shell">
  <div class="evidence-library-main">
    <header class="evidence-library-heading">
      <div><h1>증거 관리</h1><p data-evidence-scope>저장된 증거를 불러오고 있습니다.</p></div>
      <a class="library-primary" href="chose_evidence.html">증거 등록</a>
    </header>
    <div class="evidence-library-filters" role="search" aria-label="증거 검색">
      <input class="evidence-list-search" type="search" aria-label="파일명 또는 증거 ID 검색" placeholder="파일명 또는 증거 ID 검색">
      <select data-evidence-list-filter="type" aria-label="전체 유형"><option value="">전체 유형</option></select>
      <select data-evidence-list-filter="status" aria-label="전체 상태"><option value="">전체 상태</option><option>미검증</option><option>일치</option><option>불일치</option><option>검증 불가</option></select>
      <select data-evidence-list-filter="date" aria-label="등록 기간"><option value="">등록 기간</option></select>
      <select data-evidence-list-filter="sort" aria-label="정렬"><option value="latest">최신순</option><option value="oldest">오래된순</option><option value="name">파일명순</option></select>
      <button class="evidence-filter-apply" type="button" aria-label="검색 조건 적용">검색</button>
      <button class="evidence-filter-reset" type="button" aria-label="검색 조건 초기화">초기화</button>
    </div>
    <section class="evidence-library-panel" aria-labelledby="library-title">
      <div class="evidence-library-toolbar">
        <div><h2 id="library-title">증거 목록</h2><span data-evidence-count="visible" role="status">불러오는 중</span></div>
        <button class="library-primary" type="button" data-evidence-verify disabled>선택 항목 검증</button>
      </div>
      <div class="layout-table evidence-library-scroll" role="region" aria-label="증거 목록 표" tabindex="0">
        <div role="table" aria-labelledby="library-title">
          <div class="layout-table-row" role="row" data-evidence-table-header>
            <div role="columnheader" aria-label="선택"></div><div role="columnheader">증거명</div><div role="columnheader">유형</div>
            <div role="columnheader">등록 일시 (KST)</div><div role="columnheader">증거 ID</div><div role="columnheader">무결성 상태</div><div role="columnheader">상세</div>
          </div>
        </div>
      </div>
      <p class="evidence-local-empty" role="status">저장된 증거를 불러오고 있습니다.</p>
      <div class="evidence-library-footer">
        <span>전체 <span data-evidence-count="total">—</span></span>
        <nav class="evidence-pagination" aria-label="증거 목록 페이지">
          <button type="button" data-evidence-page="previous" disabled>이전</button>
          <span data-evidence-pages>1 / 1</span>
          <button type="button" data-evidence-page="next" disabled>다음</button>
        </nav>
      </div>
    </section>
  </div>
</main>
<template id="evidence-row-template">
  <div class="layout-table-row evidence-local-row" role="row">
    <div role="cell"></div><div role="cell"></div><div role="cell"></div><div role="cell"></div>
    <div role="cell"></div><div role="cell"></div><div role="cell"></div>
  </div>
</template>
</body>
</html>
