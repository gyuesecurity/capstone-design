<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>CredOc - 대시보드</title>
  <link rel="stylesheet" href="app.css?v=evidence-list-1">
  <script src="navigation.js" defer></script>
  <script src="app.js?v=evidence-list-1" defer></script>
  <script src="dashboard-local.js?v=evidence-list-1" defer></script>
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="page4-workspace.css">
  <link rel="stylesheet" href="dashboard-frame.css">
  <link rel="stylesheet" href="dashboard-content.css">
</head>
<body class="layout-page dashboard-page page4-workspace">
<header class="workspace-sidebar dashboard-bar">
    <a class="workspace-brand dashboard-brand" href="index_home.html" aria-label="CredOc 홈">
      <img src="assets/brand/credoc-wordmark.svg" alt="CredOc" width="132" height="28">
      <span class="dashboard-tagline">디지털 증거 플랫폼</span>
    </a>
    <nav class="workspace-menu dashboard-menu" aria-label="주 메뉴">
      <a href="Dashboard.html" aria-current="page">
        대시보드
      </a>
      <a href="evidence.html">
        증거 관리
      </a>
      <a href="verification.html">
        검증
      </a>
      <a href="report.html">
        보고서
      </a>
      <a href="mypage.html">
        My page
      </a>
    </nav>
  </header>
<div class="layout-shell dashboard-stage">
<div class="dashboard-frame">
  <div class="layout-section dashboard-content" role="main">
    <div class="dashboard-intro">
      <div class="dashboard-intro-copy">
        <h1 data-profile-greeting>안녕하세요</h1>
        <p data-dashboard-date>—</p>
      </div>
      <div class="dashboard-intro-actions">
        <a class="dashboard-register" href="chose_evidence.html"><span>증거 등록</span></a>
      </div>
    </div>
    <div class="layout-grid layout-grid--4 dashboard-stats">
      <article class="dashboard-stat layout-panel" data-tone="total">
        <div class="dashboard-stat-heading"><h2>전체 증거</h2></div>
        <p class="dashboard-stat-value"><strong data-dashboard-count="total">—</strong> <span>건</span></p>
        <p class="dashboard-stat-note">등록된 모든 증거</p>
      </article>
      <article class="dashboard-stat layout-panel" data-tone="match">
        <div class="dashboard-stat-heading"><h2>해시 일치</h2></div>
        <p class="dashboard-stat-value"><strong data-dashboard-count="match">—</strong> <span>건</span></p>
        <p class="dashboard-stat-note">원본과 해시 일치</p>
      </article>
      <article class="dashboard-stat layout-panel" data-tone="pending">
        <div class="dashboard-stat-heading"><h2>검증 필요</h2></div>
        <p class="dashboard-stat-value"><strong data-dashboard-count="pending">—</strong> <span>건</span></p>
        <p class="dashboard-stat-note">미검증 또는 검증 불가</p>
      </article>
      <article class="dashboard-stat layout-panel" data-tone="mismatch">
        <div class="dashboard-stat-heading"><h2>위변조 의심</h2></div>
        <p class="dashboard-stat-value"><strong data-dashboard-count="mismatch">—</strong> <span>건</span></p>
        <p class="dashboard-stat-note">변경 여부 확인 필요</p>
      </article>
    </div>
    <div class="layout-grid layout-grid--2 dashboard-details">
      <section class="dashboard-panel layout-panel">
        <div class="dashboard-panel-heading"><h2>무결성 검증 현황</h2><span data-dashboard-chart-total>전체 —건</span></div>
        <div class="dashboard-chart">
          <div class="dashboard-chart-row" data-tone="match">
            <div class="dashboard-chart-label"><span>일치</span><small data-dashboard-chart-count="match">—건</small><strong data-dashboard-chart-percent="match">—%</strong></div>
            <div class="dashboard-chart-track"><div data-dashboard-chart-bar="match"></div></div>
          </div>
          <div class="dashboard-chart-row" data-tone="pending">
            <div class="dashboard-chart-label"><span>검증 필요</span><small data-dashboard-chart-count="pending">—건</small><strong data-dashboard-chart-percent="pending">—%</strong></div>
            <div class="dashboard-chart-track"><div data-dashboard-chart-bar="pending"></div></div>
          </div>
          <div class="dashboard-chart-row" data-tone="mismatch">
            <div class="dashboard-chart-label"><span>위변조 의심</span><small data-dashboard-chart-count="mismatch">—건</small><strong data-dashboard-chart-percent="mismatch">—%</strong></div>
            <div class="dashboard-chart-track"><div data-dashboard-chart-bar="mismatch"></div></div>
          </div>
        </div>
      </section>
      <section class="dashboard-panel layout-panel">
        <div class="dashboard-panel-heading"><h2>최근 활동</h2></div>
        <div data-dashboard-activities></div>
      </section>
    </div>
    <div class="layout-table layout-table--dashboard dashboard-recent">
      <div class="layout-wrap dashboard-recent-heading">
        <div><h2>최근 등록된 증거</h2><span data-dashboard-recent-count>—건</span></div>
        <a class="dashboard-view-all" href="evidence.html"><span>전체 보기</span></a>
      </div>
      <div data-dashboard-recent-header class="layout-table-row">
        <div>증거명</div><div>유형</div><div>등록 일시 (KST)</div><div>무결성 상태</div>
      </div>
    </div>
  </div>
</div>
</div>
</body>
</html>
