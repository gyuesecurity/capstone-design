<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVIDENCE - 이용약관 동의</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="auth.css">
<script src="auth.js" defer></script>
</head><body class="auth-page">
<main class="auth-card auth-card--terms" data-node-id="25:4">
<img class="auth-glyph" src="assets/auth/9dfc6.svg" alt="">
<header class="auth-heading"><h1>Camerica 이용약관 동의</h1><p>서비스 이용을 위해 아래 약관에 동의해주세요.</p></header>
<form id="terms-form"><div class="auth-terms-list">
<div class="auth-term auth-term--all"><label><input id="agree-all" type="checkbox" ><span>전체 동의</span></label><button type="button" data-terms-toggle="all" aria-label="전체 동의 안내 보기" aria-expanded="false"><img src="assets/auth/2d0b0.svg" alt=""></button></div>
<p class="auth-term-detail" id="term-all" hidden>필수 두 항목과 선택 항목을 함께 선택합니다. 선택 항목은 동의하지 않아도 다음 화면으로 이동할 수 있습니다.</p>
<div class="auth-term "><label><input id="agree-service" type="checkbox" required><span>(필수) 서비스 이용약관 동의</span></label><button type="button" data-terms-toggle="service" aria-label="(필수) 서비스 이용약관 동의 안내 보기" aria-expanded="false"><img src="assets/auth/2d0b0.svg" alt=""></button></div>
<p class="auth-term-detail" id="term-service" hidden>화면 시연용 약관 항목입니다. 실제 서비스 이용약관은 서비스 운영 정책 확정 후 제공됩니다.</p>
<div class="auth-term "><label><input id="agree-privacy" type="checkbox" required><span>(필수) 개인정보 수집 및 이용 동의</span></label><button type="button" data-terms-toggle="privacy" aria-label="(필수) 개인정보 수집 및 이용 동의 안내 보기" aria-expanded="false"><img src="assets/auth/2d0b0.svg" alt=""></button></div>
<p class="auth-term-detail" id="term-privacy" hidden>이 화면에서는 입력한 개인정보를 저장하거나 서버로 전송하지 않습니다. 실제 개인정보 처리방침은 인증 서버 연결 시 제공됩니다.</p>
<div class="auth-term "><label><input id="agree-marketing" type="checkbox" ><span>(선택) 마케팅 정보 수신 동의</span></label><button type="button" data-terms-toggle="marketing" aria-label="(선택) 마케팅 정보 수신 동의 안내 보기" aria-expanded="false"><img src="assets/auth/2d0b0.svg" alt=""></button></div>
<p class="auth-term-detail" id="term-marketing" hidden>선택 항목입니다. 화면 시연 중에는 마케팅 메시지를 발송하지 않습니다.</p></div>
<div class="auth-actions"><a class="auth-button" href="signup.html">이전으로</a><button class="auth-button auth-button--primary" type="submit">동의하고 가입하기</button></div></form><a class="auth-close" href="index.html" aria-label="약관 동의 창 닫기"><img src="assets/auth/41da6.svg" alt=""></a></main></body></html>
