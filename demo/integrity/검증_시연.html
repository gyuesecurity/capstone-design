<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 거래기록 무결성 검증 시연</title>
<style>
.verification-page { font-family: "Noto Sans KR", "DM Sans", Arial, sans-serif; }
.verification-main { width: 100%; box-sizing: border-box; padding: 48px 96px 64px; display: flex; flex-direction: column; gap: 24px; }
.verification-main * { box-sizing: border-box; }
.verification-main h1, .verification-main h2, .verification-main h3 { margin: 0; color: var(--evidence-ink); font-weight: 600; }
.verification-main h1 { font-size: 28px; }
.verification-main h2 { font-size: 22px; }
.verification-main h3 { font-size: 16px; overflow-wrap: anywhere; }
.verification-main p { color: var(--evidence-muted); font-size: 14px; line-height: 1.65; }
.verification-heading, .verification-card-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.verification-heading p { margin-bottom: 0; }
.verification-primary, .verification-secondary { min-height: 42px; border-radius: 8px; padding: 10px 18px; font: 500 13px/1.5 "Noto Sans KR", Arial, sans-serif; white-space: nowrap; cursor: pointer; }
.verification-primary { background: var(--evidence-blue); border: 1px solid var(--evidence-blue); color: white; }
.verification-secondary { border: 1px solid var(--evidence-line); background: white; color: var(--evidence-blue); }
.verification-main button:disabled { opacity: .5; cursor: not-allowed; }
.verification-main :is(button, input, select, a, summary):focus-visible { outline: 3px solid #91b3ff; outline-offset: 3px; }
.verification-notice { margin: 0; padding: 16px 20px; background: #edf3ff; border-radius: 12px; }
.verification-panel { background: white; border: 1px solid var(--evidence-line); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px #203c7008; }
.verification-panel-head, .verification-padded { padding: 28px; }
.verification-panel-head { display: flex; flex-direction: column; gap: 24px; }
#verification-count { color: #2454c6; font-size: 12px; }
.verification-filters { display: flex; align-items: end; gap: 12px; }
.verification-filters label { display: flex; flex-direction: column; gap: 8px; font-size: 12px; min-width: 0; }
.verification-search-label { flex: 1; }
.verification-filters input, .verification-filters select { height: 46px; border: 1px solid var(--evidence-line); border-radius: 8px; padding: 0 14px; color: var(--evidence-ink); background: white; min-width: 0; font: inherit; }
.verification-filters select { width: 150px; }
.verification-table-scroll { overflow-x: auto; }
.verification-table { border-collapse: collapse; width: 100%; min-width: 840px; table-layout: fixed; text-align: left; font-size: 13px; }
.verification-table th { background: var(--evidence-surface); font-weight: 500; color: var(--evidence-muted); }
.verification-table :is(th, td) { padding: 16px 12px; border-bottom: 1px solid var(--evidence-line); overflow-wrap: anywhere; }
.verification-table th:first-child { width: 52px; padding-left: 24px; }
.verification-table td:first-child { padding-left: 24px; }
.verification-table th:nth-child(2) { width: 30%; }
.verification-table th:nth-child(3) { width: 70px; }
.verification-table th:nth-child(4) { width: 180px; }
.verification-table th:last-child { width: 110px; }
.verification-table td { color: var(--evidence-muted); }
.verification-table td strong { display: block; font-weight: 500; color: var(--evidence-ink); }
.verification-table td small { display: block; margin-top: 5px; }
.verification-table input { width: 18px; height: 18px; accent-color: var(--evidence-blue); cursor: pointer; }
.verification-row-selected { background: #edf3ff; }
.verification-panel-footer { padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--evidence-muted); font-size: 12px; }
.verification-badge { display: inline-flex; padding: 5px 10px; border-radius: 100px; background: #fff7e1; color: #986b12; font-size: 12px; white-space: nowrap; }
.verification-badge[data-status="MATCH"] { color: #21815a; background: #eaf7f0; }
.verification-badge[data-status="MISMATCH"], .verification-badge[data-status="UNAVAILABLE"] { color: #b43d3d; background: #fff0ef; }
.verification-empty { padding: 16px 0; color: var(--evidence-muted); }
.verification-target, .verification-result { padding: 20px; border: 1px solid var(--evidence-line); border-radius: 12px; margin-top: 16px; }
.verification-details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.verification-details div { min-width: 0; }
.verification-details dt { color: var(--evidence-muted); font-size: 12px; margin-bottom: 6px; }
.verification-details dd { margin: 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.verification-result a { font-size: 13px; color: #2454c6; text-decoration: none; }
.verification-save-state[data-saved="false"] { color: #b43d3d; font-weight: 600; }
.verification-history-entry { border-top: 1px solid var(--evidence-line); padding: 16px 0; }
.verification-history-entry summary { cursor: pointer; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
@media (max-width: 1100px) {
  .verification-main { padding: 32px; }
  .verification-header { padding-left: 32px !important; padding-right: 32px !important; }
}
@media (max-width: 700px) {
  .verification-main { padding: 24px 16px; }
  .verification-header { height: auto !important; flex-wrap: wrap; padding: 20px 16px 0 !important; }
  .verification-header > div:last-child { gap: 20px !important; width: 100%; overflow-x: auto !important; }
  .verification-header > div:last-child > div { flex-shrink: 0; }
  .verification-heading, .verification-card-heading { flex-wrap: wrap; }
  .verification-panel-head, .verification-padded { padding: 20px; }
  .verification-filters { flex-wrap: wrap; }
  .verification-search-label { flex-basis: 100%; }
  .verification-filters label:not(.verification-search-label) { flex: 1; }
  .verification-filters select { width: 100%; }
  .verification-details { grid-template-columns: 1fr; }
  .verification-panel-footer { padding: 16px; }
}

:root { --evidence-ink:#172136; --evidence-blue:#305dd1; --evidence-line:#d5ddeb; --evidence-muted:#526078; --evidence-surface:#f3f6fb }
body { margin:0; background:#f6f8fc; color:var(--evidence-ink) }
.verification-main { max-width:960px; padding:36px 20px; margin:auto; gap:16px }
.sample-controls { display:flex; flex-wrap:wrap; align-items:end; gap:12px; }
.sample-controls label { display:grid; gap:6px; font-weight:600; font-size:14px }
.sample-controls select { font:inherit; padding:9px; border:1px solid var(--evidence-line); border-radius:8px; background:#fff; color:inherit }
pre { white-space:pre-wrap; word-break:break-word; font:inherit; font-size:14px; line-height:1.7 }
#verification-results:empty { display:none }
</style>
</head>
<body class="verification-page"><main id="local-verification" class="verification-main">
<header><h1>가상 거래기록 무결성 검증</h1>
<p>등록 당시 거래금액은 30,000원입니다. 저장된 사본에서 금액 한 자리가 바뀌었을 때 검증 결과를 확인해 보세요.</p></header>
<section class="verification-panel verification-padded" aria-label="시연 조작">
<div class="sample-controls">
<label for="sample-version">검증할 저장 사본<select id="sample-version" disabled>
<option value="modified" selected>수정본 · 90,000원</option>
<option value="original">원본 · 30,000원</option></select></label>
<button type="button" class="verification-primary" data-run-verification disabled>증거 검증</button></div>
<p>이 페이지의 시연 기록은 새로 열면 초기화됩니다.</p></section>
<section class="verification-panel verification-padded" aria-labelledby="result-title">
<h2 id="result-title">검증 결과</h2>
<p id="verification-message" role="status" aria-live="polite">시연용 사본을 준비하고 있습니다.</p>
<div id="verification-results"></div></section>
<section class="verification-panel verification-padded" id="sample-detail">
<h2>저장 사본 내용</h2><pre id="sample-preview"></pre></section>
<section class="verification-panel verification-padded"><h2>최근 검증 이력</h2><div id="verification-history"></div></section>
<div hidden>
<span data-verification-storage></span><input id="verification-search"><select id="verification-type"></select>
<select id="verification-status"></select><table><tbody id="verification-rows"></tbody></table>
<span id="verification-count"></span><input id="verification-select-all" type="checkbox">
<button type="button" id="verification-clear"></button><div id="verification-targets"></div>
</div></main>
<script>
(function () {
  "use strict";
  const labels = { NOT_VERIFIED: "미검증", MATCH: "일치", MISMATCH: "불일치", UNAVAILABLE: "검증 불가" };

  async function init(api) {
    const root = document.getElementById("local-verification");
    if (!root) return;
    const search = root.querySelector("#verification-search");
    const type = root.querySelector("#verification-type");
    const status = root.querySelector("#verification-status");
    const rows = root.querySelector("#verification-rows");
    const count = root.querySelector("#verification-count");
    const selectAll = root.querySelector("#verification-select-all");
    const message = root.querySelector("#verification-message");
    const targets = root.querySelector("#verification-targets");
    const results = root.querySelector("#verification-results");
    const history = root.querySelector("#verification-history");
    const buttons = Array.from(root.querySelectorAll("[data-run-verification]"));
    let records = [];
    let selected = new Set(api.readSelection().map(record => record.id));
    let busy = false;
    let loaded = false;
    const backend = await api.isBackend();
    root.querySelector("[data-verification-storage]").textContent = backend ? "서버에 저장된 파일을 검사합니다." : "이 브라우저에 저장된 파일을 검사합니다.";

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function badge(code) {
      const node = element("span", labels[code] || "미검증", "verification-badge");
      node.dataset.status = code || "NOT_VERIFIED";
      return node;
    }

    function addDetails(parent, entries) {
      const list = element("dl", undefined, "verification-details");
      entries.forEach(([label, value]) => {
        const item = element("div");
        item.append(element("dt", label), element("dd", value || "없음"));
        list.append(item);
      });
      parent.append(list);
    }

    function visibleRecords() {
      const query = search.value.trim().toLowerCase();
      return records.filter(record =>
        (!query || `${record.name} ${record.filename} ${record.id}`.toLowerCase().includes(query)) &&
        (!type.value || record.type === type.value) &&
        (!status.value || (record.verificationStatus || "NOT_VERIFIED") === status.value));
    }

    function updateSelection() {
      const visible = visibleRecords();
      count.textContent = `${visible.length} / ${records.length}개 증거 · ${selected.size}개 선택됨`;
      const eligible = visible.filter(api.canVerify);
      selectAll.checked = eligible.length > 0 && eligible.every(record => selected.has(record.id));
      selectAll.indeterminate = !selectAll.checked && visible.some(record => selected.has(record.id));
      selectAll.disabled = busy || eligible.length === 0;
      buttons.forEach(button => {
        button.disabled = busy || !loaded || selected.size === 0;
        button.textContent = busy ? "검증 중…" : "증거 검증";
      });
      root.querySelector("#verification-clear").disabled = busy || !selected.size;
      [search, type, status].forEach(control => { control.disabled = busy || !loaded; });
      targets.replaceChildren();
      const chosen = records.filter(record => selected.has(record.id));
      if (!chosen.length) targets.append(element("p", "검증할 파일을 목록에서 선택해 주세요.", "verification-empty"));
      chosen.forEach(record => {
        const card = element("article", undefined, "verification-target");
        card.append(element("h3", record.name), element("p", record.filename));
        addDetails(card, [["증거 ID", record.id], ["파일 정보", `${record.type} · ${record.size.toLocaleString("ko-KR")} bytes`], ["등록 일시", api.formatDate(record.registeredAt)], ["등록 당시 SHA-256", record.sha256]]);
        targets.append(card);
      });
      api.saveSelection(chosen.map(record => ({ id: record.id, name: record.name, type: record.type })));
    }

    function renderRows() {
      rows.replaceChildren();
      const visible = visibleRecords();
      visible.forEach(record => {
        const row = element("tr");
        row.dataset.verificationEvidenceRow = record.id;
        row.classList.toggle("verification-row-selected", selected.has(record.id));
        const cell = element("td");
        const checkbox = element("input");
        checkbox.type = "checkbox";
        checkbox.checked = selected.has(record.id);
        checkbox.disabled = busy || !api.canVerify(record);
        if (!api.canVerify(record)) checkbox.title = "검증 권한이 없습니다.";
        checkbox.setAttribute("aria-label", `${record.filename} 선택`);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selected.add(record.id); else selected.delete(record.id);
          renderRows();
        });
        cell.append(checkbox);
        const name = element("td");
        name.append(element("strong", record.name), element("small", record.filename));
        const state = element("td");
        state.append(badge(record.verificationStatus));
        row.append(cell, name, element("td", record.type), element("td", api.formatDate(record.registeredAt)), element("td", record.id, "verification-id"), state);
        rows.append(row);
      });
      if (!visible.length) {
        const row = element("tr");
        const cell = element("td", records.length ? "검색 조건에 맞는 증거가 없습니다." : "등록된 파일이 없습니다. 증거 관리에서 파일을 등록해 주세요.", "verification-empty");
        cell.colSpan = 6;
        row.append(cell);
        rows.append(row);
      }
      updateSelection();
    }

    function resultCard(result, saved) {
      const card = element("article", undefined, "verification-result");
      card.dataset.verificationResult = result.status;
      card.dataset.saved = String(saved);
      const heading = element("div", undefined, "verification-card-heading");
      heading.append(element("h3", result.filename), badge(result.status));
      card.append(heading, element("p", result.reason));
      addDetails(card, [["증거 ID", result.evidenceId], ["검증 실행 ID", result.id], ["등록 당시 SHA-256", result.expectedHash], ["현재 SHA-256", result.currentHash || "계산하지 못함"], ["검증 일시", api.formatDate(result.completedAt)]]);
      const destination = backend ? "서버" : "이 브라우저";
      const storage = element("p", saved ? `결과와 이력을 ${destination}에 저장했습니다.` : `${destination}에 저장된 검증 결과를 확인할 수 없습니다.`, "verification-save-state");
      storage.dataset.saved = String(saved);
      card.append(storage);
      const link = element("a", "증거 상세보기");
      link.href = `evidence.html?id=${encodeURIComponent(result.evidenceId)}`;
      card.append(link);
      return card;
    }

    function renderHistory() {
      history.replaceChildren();
      const entries = records.flatMap(record => Array.isArray(record.verifications) ? record.verifications : [])
        .sort((a, b) => b.completedAt.localeCompare(a.completedAt)).slice(0, 20);
      if (!entries.length) history.append(element("p", "아직 실행한 검증이 없습니다.", "verification-empty"));
      entries.forEach(entry => {
        const detail = element("details", undefined, "verification-history-entry");
        const summary = element("summary", `${entry.filename} · ${labels[entry.status]} · ${api.formatDate(entry.completedAt)}`);
        detail.append(summary, resultCard(entry, true));
        history.append(detail);
      });
    }

    async function loadRecords() {
      records = backend ? await api.list() : await api.store("readonly", tx => tx.objectStore("records").getAll());
      records.sort((a, b) => b.registeredAt.localeCompare(a.registeredAt));
      selected = new Set(Array.from(selected).filter(id => records.some(record => record.id === id && api.canVerify(record))));
      const oldType = type.value;
      type.replaceChildren(new Option("전체 유형", ""));
      Array.from(new Set(records.map(record => record.type))).sort().forEach(value => type.add(new Option(value, value)));
      if (Array.from(type.options).some(option => option.value === oldType)) type.value = oldType;
      loaded = true;
      renderRows();
      renderHistory();
    }

    async function checkFile(record) {
      if (backend) {
        try { return await api.verify(record.id); }
        catch (error) {
          return { saved: false, result: {
            evidenceId: record.id, filename: record.filename, status: "UNAVAILABLE",
            reason: error.message || "서버 검증 결과를 확인할 수 없습니다."
          } };
        }
      }
      const result = { id: `VERIFY-${crypto.randomUUID()}`, evidenceId: record.id, filename: record.filename, performedBy: "user",
        startedAt: new Date().toISOString(), expectedHash: null, currentHash: null, status: "UNAVAILABLE", reason: "파일을 읽지 못했습니다." };
      try {
        // Read the metadata and immutable Blob in one transaction, then hash that snapshot.
        const snapshot = await api.store("readonly", tx => {
          const data = {};
          const metadata = tx.objectStore("records").get(record.id);
          const file = tx.objectStore("files").get(record.id);
          metadata.onsuccess = () => { data.record = metadata.result; };
          file.onsuccess = () => { data.file = file.result; };
          return { result: data };
        });
        result.expectedHash = snapshot.record && snapshot.record.sha256;
        if (!snapshot.record) result.reason = "등록 정보를 찾을 수 없어 검증을 완료하지 못했습니다.";
        else if (!/^[a-f0-9]{64}$/i.test(result.expectedHash || "")) result.reason = "유효한 등록 기준 해시가 없어 비교할 수 없습니다.";
        else if (!(snapshot.file instanceof Blob)) result.reason = "저장된 파일을 찾을 수 없어 검증을 완료하지 못했습니다.";
        else {
          const digest = await crypto.subtle.digest("SHA-256", await snapshot.file.arrayBuffer());
          result.currentHash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
          result.status = result.currentHash === result.expectedHash.toLowerCase() ? "MATCH" : "MISMATCH";
          result.reason = result.status === "MATCH" ? "현재 파일의 SHA-256이 등록 당시의 기준값과 일치합니다." : "현재 파일의 SHA-256이 등록 당시의 기준값과 일치하지 않습니다.";
        }
      } catch (error) {
        result.reason = "파일 읽기 또는 해시 계산에 실패해 검증을 완료하지 못했습니다.";
      }
      result.completedAt = new Date().toISOString();
      let saved = false;
      try {
        await api.store("readwrite", tx => {
          const store = tx.objectStore("records");
          const request = store.get(record.id);
          request.onsuccess = () => {
            const latest = request.result;
            if (!latest || latest.sha256 !== result.expectedHash) { tx.abort(); return; }
            latest.verifications = (latest.verifications || []).concat(result);
            if (!latest.lastVerification || latest.lastVerification.completedAt <= result.completedAt) {
              latest.lastVerification = result;
              latest.verificationStatus = result.status;
              latest.status = labels[result.status];
            }
            store.put(latest);
          };
          return request;
        });
        saved = true;
      } catch (error) { /* Keep the computed result visible, explicitly marked as unsaved. */ }
      return { result, saved };
    }

    async function run() {
      if (busy || !loaded || !selected.size) return;
      busy = true;
      const chosen = records.filter(record => selected.has(record.id));
      renderRows();
      results.replaceChildren();
      let stored = 0;
      try {
        for (let index = 0; index < chosen.length; index += 1) {
          message.textContent = `${index + 1} / ${chosen.length}개 파일의 SHA-256을 계산하고 있습니다.`;
          const checked = await checkFile(chosen[index]);
          if (checked.saved) stored += 1;
          results.append(resultCard(checked.result, checked.saved));
        }
        message.textContent = `${chosen.length}개 검증 요청 · ${stored}개 결과 저장${stored !== chosen.length ? " · 결과를 확인할 수 없는 항목의 사유를 확인해 주세요." : ""}`;
        await loadRecords();
      } catch (error) {
        message.textContent = `검증 처리 또는 목록 갱신에 실패했습니다. ${error.message || "새로고침해 주세요."}`;
      } finally {
        busy = false;
        renderRows();
      }
    }

    [search, type, status].forEach(control => control.addEventListener(control === search ? "input" : "change", renderRows));
    selectAll.addEventListener("change", () => {
      visibleRecords().filter(api.canVerify).forEach(record => { if (selectAll.checked) selected.add(record.id); else selected.delete(record.id); });
      renderRows();
    });
    root.querySelector("#verification-clear").addEventListener("click", () => { selected.clear(); renderRows(); });
    buttons.forEach(button => button.addEventListener("click", run));
    try {
      await loadRecords();
      message.textContent = "파일을 선택하고 ‘증거 검증’을 눌러 주세요.";
    } catch (error) {
      message.textContent = `등록한 파일을 불러오지 못했습니다. ${error.message || "새로고침해 주세요."}`;
      count.textContent = "불러오기 실패";
    }
  }

  window.EvidenceVerification = { init };
})();

</script>
<script>
const sample = {"original": "6rWQ7Jyh7JqpIOqwgOyDgSDqsbDrnpjquLDroZ0NCuqxsOuemOuyiO2YuCBERU1PLVRYLTAwMQ0K6rGw656Y7Iuc6rCBIDIwMjYtMTEtMDggMTU6MjA6MDAgS1NUDQrqsbDrnpjsspgg6rCA7IOB7IOB7KCQIEENCu2SiOuqqSDthYzsiqTtirgg7J6l67mEIOuMgOyXrA0K6rGw656Y6riI7JWhIDMwLDAwMOybkA0K", "modified": "6rWQ7Jyh7JqpIOqwgOyDgSDqsbDrnpjquLDroZ0NCuqxsOuemOuyiO2YuCBERU1PLVRYLTAwMQ0K6rGw656Y7Iuc6rCBIDIwMjYtMTEtMDggMTU6MjA6MDAgS1NUDQrqsbDrnpjsspgg6rCA7IOB7IOB7KCQIEENCu2SiOuqqSDthYzsiqTtirgg7J6l67mEIOuMgOyXrA0K6rGw656Y6riI7JWhIDkwLDAwMOybkA0K", "registeredHash": "e6f9489ef70e7a588731ff07e17fb5494bfc7811e82d228b458ba3b3610a685f", "registeredSize": 177};
const recordId = "DEMO-TX-001";
const selector = document.getElementById("sample-version");
const message = document.getElementById("verification-message");
const preview = document.getElementById("sample-preview");
const results = document.getElementById("verification-results");
const checkButton = document.querySelector("[data-run-verification]");
const copies = Object.fromEntries(["original", "modified"].map(name => {
  const bytes = Uint8Array.from(atob(sample[name]), ch => ch.charCodeAt(0));
  return [name, new Blob([bytes], { type: "text/plain;charset=utf-8" })];
}));

async function start() {
  const dbName = "integrity-sample-" + crypto.randomUUID();
  // The sample uses a private database for this page instance.
  const db = await new Promise((resolve, reject) => {
    const open = indexedDB.open(dbName, 1);
    open.onupgradeneeded = () => {
      open.result.createObjectStore("records", { keyPath: "id" });
      open.result.createObjectStore("files");
    };
    open.onsuccess = () => resolve(open.result);
    open.onerror = () => reject(open.error);
  });
  window.addEventListener("pagehide", event => {
    if (!event.persisted) {
      db.close();
      indexedDB.deleteDatabase(dbName);
    }
  });
  function store(mode, work) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(["records", "files"], mode);
      const request = work(tx);
      tx.oncomplete = () => resolve(request?.result);
      tx.onabort = () => reject(tx.error || new Error("시연 파일을 읽을 수 없습니다."));
    });
  }
  await store("readwrite", tx => {
    tx.objectStore("records").put({
      id:recordId, name:"가상 거래기록", filename:"거래기록.txt", type:"TXT", size:sample.registeredSize,
      registeredAt:"2026-11-08T06:20:00Z", sha256:sample.registeredHash, verificationStatus:"NOT_VERIFIED"
    });
    tx.objectStore("files").put(copies.modified, recordId);
  });
  preview.textContent = await copies.modified.text();
  let selection = [{ id:recordId }];
  const dates = new Intl.DateTimeFormat("ko-KR", { dateStyle:"medium", timeStyle:"medium", timeZone:"Asia/Seoul" });
  await window.EvidenceVerification.init({
    isBackend:async () => false, canVerify:() => true, store,
    readSelection:() => selection, saveSelection:value => { selection = value; },
    formatDate:value => dates.format(new Date(value))
  });
  selector.disabled = false;
  message.textContent = "‘증거 검증’을 눌러 현재 사본의 SHA-256을 계산하세요.";
  selector.addEventListener("change", async () => {
    selector.disabled = true;
    checkButton.disabled = true;
    try {
      const copy = copies[selector.value];
      await store("readwrite", tx => tx.objectStore("files").put(copy, recordId));
      preview.textContent = await copy.text();
      results.replaceChildren();
      message.textContent = "‘증거 검증’을 눌러 선택한 사본을 검사하세요.";
      checkButton.disabled = false;
      selector.disabled = false;
    } catch (error) {
      message.textContent = "시연 사본을 바꾸지 못했습니다. 페이지를 새로 열어 주세요.";
    }
  });
  // Each history/result card uses this standalone page's evidence section.
  new MutationObserver(() => {
    for (const a of document.querySelectorAll('a[href^="evidence.html"]')) a.setAttribute("href", "#sample-detail");
    if (selector.disabled !== checkButton.disabled) selector.disabled = checkButton.disabled;
  }).observe(document.querySelector("main"), { subtree:true, childList:true, attributes:true, attributeFilter:["disabled"] });
}
start().catch(() => {
  message.textContent = "시연 저장소를 열 수 없습니다. ZIP을 풀고 이 HTML을 Edge 또는 Chrome에서 열어 주세요.";
});
</script></body></html>
