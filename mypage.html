<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVIDENCE - 마이페이지</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="mypage.css">
  <script src="account.js" defer></script>
  <script src="mypage.js" defer></script>
</head>
<body>
  <div class="account-shell">
    <header class="account-header">
      <a class="account-brand" href="index_home.html"><span class="account-brand__mark" aria-hidden="true"></span><span class="account-brand__name">EVIDENCE</span><span class="account-brand__detail">디지털 증거 플랫폼</span></a>
      <nav class="account-nav" aria-label="주 메뉴">
        <a href="Dashboard.html">대시보드</a><a href="evidence.html">증거 관리</a><a href="verification.html">검증</a><a href="report.html">보고서</a><a class="account-nav__mypage" href="mypage.html" aria-current="page">My page</a>
      </nav>
    </header>
    <main class="mypage-main">
      <div class="mypage-intro"><h1>My page</h1><p>계정 정보와 서비스 이용 내역을 확인하세요.</p></div>
      <p class="mypage-message" data-mypage-message role="status" hidden></p>

      <section class="mypage-card mypage-profile" aria-labelledby="mypage-profile-title">
        <div class="mypage-avatar" aria-hidden="true">👤</div>
        <div class="mypage-profile-details">
          <h2 id="mypage-profile-title" data-profile-name>불러오는 중</h2>
          <p data-profile-email>—</p>
          <small>가입일 <time data-profile-created>—</time></small>
        </div>
        <a class="mypage-outline-button" href="profile_edit.html">프로필 수정</a>
      </section>

      <section aria-labelledby="mypage-summary-title">
        <h2 id="mypage-summary-title" class="mypage-section-title">서비스 이용 현황</h2>
        <div class="mypage-stats">
          <div class="mypage-card mypage-stat"><span>전체 증거</span><strong data-mypage-stat="evidence">—</strong></div>
          <div class="mypage-card mypage-stat"><span>해시 일치</span><strong data-mypage-stat="matched">—</strong></div>
          <div class="mypage-card mypage-stat"><span>검증 실행</span><strong data-mypage-stat="verifications">—</strong></div>
          <div class="mypage-card mypage-stat"><span>최근 활동</span><strong class="mypage-stat-date" data-mypage-stat="latest">—</strong></div>
        </div>
      </section>

      <div class="mypage-columns">
        <section class="mypage-card mypage-activity" aria-labelledby="mypage-activity-title">
          <div class="mypage-card-heading"><h2 id="mypage-activity-title">최근 활동</h2><span data-mypage-activity-count>불러오는 중</span></div>
          <ul data-mypage-activities></ul>
        </section>
        <section class="mypage-card mypage-settings" aria-labelledby="mypage-settings-title">
          <div class="mypage-card-heading"><h2 id="mypage-settings-title">계정 설정</h2></div>
          <a href="profile_edit.html"><strong>프로필 정보</strong><span>가입 정보 확인 및 이름 수정</span></a>
          <a href="password_change.html"><strong>비밀번호 변경</strong><span>로그인 비밀번호 변경</span></a>
          <a href="logout_confirm.html"><strong>로그아웃</strong><span>현재 세션 종료</span></a>
        </section>
      </div>

      <section class="mypage-card mypage-security" aria-labelledby="mypage-security-title">
        <h2 id="mypage-security-title">계정 정보</h2>
        <dl>
          <div><dt>이메일</dt><dd data-profile-email>—</dd></div>
          <div><dt>가입일</dt><dd data-profile-created>—</dd></div>
          <div><dt>최근 로그인</dt><dd data-mypage-last-login>—</dd></div>
        </dl>
      </section>
    </main>
  </div>
</body>
</html>
