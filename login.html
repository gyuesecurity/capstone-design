
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVIDENCE - 로그인</title>
    <style>
        body {
            margin: 0;
            font-family: "Noto Sans KR", sans-serif;
            background: #F6F8FB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 360px;
            max-width: calc(100% - 48px);
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2454C6;
            text-align: center;
        }

        h2 {
            text-align: center;
            color: #18243A;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #D5DCE5;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            background: #2454C6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <main class="login-container">
        <h1>EVIDENCE</h1>
        <h2>로그인</h2>

        <form id="login-form">
            <label for="email">이메일</label>
            <input
                type="email"
                id="email"
                placeholder="이메일을 입력하세요"
                autocomplete="username"
                required
            >

            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password"
                required
            >

            <button type="submit">로그인</button>
        </form>

        <div class="signup">
            계정이 없으신가요?
            <a href="signup.html">회원가입</a>
        </div>
    </main>

    <script>
        document.getElementById("login-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("현재 로그인 화면만 구현된 상태입니다.");
            });
    </script>

</body>
</html>
