
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVIDENCE - 로그인</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F6F8FB;
            font-family: "DM Sans", "Noto Sans KR", sans-serif;
        }

        .login-card {
            width: 400px;
            max-width: calc(100% - 32px);
            min-height: 434px;
            padding: 32px;
            background: white;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
            border-radius: 16px;
            position: relative;
        }

        .logo {
            width: 48px;
            height: 48px;
            border: 4px solid #8A89EC;
            margin: 0 auto 16px;
        }

        .heading {
            text-align: center;
        }

        .heading h1 {
            margin: 0;
            color: #17181C;
            font-size: 24px;
            font-weight: 500;
            line-height: 31.2px;
        }

        .heading p {
            margin: 4px 0 0;
            color: #5E6470;
            font-size: 14px;
            font-weight: 500;
            line-height: 21.7px;
        }

        form {
            margin-top: 36px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #17181C;
            font-size: 12px;
            font-weight: 500;
        }

        .required {
            color: #C00C0C;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            background: white;
            border: 1px solid #E5E8EC;
            border-radius: 8px;
            color: #17181C;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: 2px solid #8A89EC;
            outline-offset: 1px;
        }

        .account-links {
            margin-top: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #5E6470;
        }

        .account-links a {
            color: #5E6470;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            height: 44px;
            margin-top: 8px;
            background: #8A89EC;
            border: none;
            border-radius: 8px;
            color: #0F1830;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
        }

        .login-button:hover {
            background: #7776DB;
        }

        .close-button {
            position: absolute;
            right: 32px;
            top: 32px;
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #E5E8EC;
            border-radius: 16px;
            color: #5E6470;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <script src="navigation.js" defer></script>
</head>

<body>

    <main class="login-card">

        <div class="logo"></div>

        <div class="heading">
            <h1>Log in</h1>
            <p>Enter your credentials to continue.</p>
        </div>

        <form id="login-form">

            <div class="field">
                <label for="email">
                    Email <span class="required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    Password <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="account-links">
                <span>아이디 찾기</span>
                <span>|</span>
                <span>비밀번호 찾기</span>
                <span>|</span>
                <span>회원가입</span>
            </div>

            <button type="submit" class="login-button">
                로그인
            </button>

        </form>

        <a href="index.html"
           class="close-button"
           aria-label="로그인 창 닫기">
            ×
        </a>

    </main>

    <script>
        // 화면 연결 테스트용입니다.
        // 실제 사용자 인증은 수행하지 않습니다.
        document.getElementById("login-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                // 이메일 형식과 필수 입력 여부는
                // 브라우저가 기본적으로 확인합니다.
                // 입력값을 저장하거나 서버로 전송하지 않습니다.
                window.location.href = "index_home.html";
            });
    </script>

</body>
</html>
