<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVIDENCE - 로그인</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="auth.css">
<script src="auth.js" defer></script>
</head><body class="auth-page">
<main class="auth-card auth-card--login" data-node-id="10:363">
<img class="auth-glyph" src="assets/auth/47e9c.svg" alt="">
<header class="auth-heading"><h1>Log in</h1><p>Enter your credentials to continue.</p></header>
<form id="login-form"><div class="auth-fields">
<div class="auth-field"><label for="email">Email <span>*</span></label><div class="auth-input"><img src="assets/auth/7f38d.svg" alt=""><input id="email" type="email" placeholder="you@example.com" autocomplete="username" required></div></div>
<div class="auth-field"><label for="password">Password <span>*</span></label><div class="auth-input"><img src="assets/auth/3f1b8.svg" alt=""><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div></div>
</div>
<nav class="auth-links" aria-label="계정 도움말"><button type="button" data-recovery="id">아이디 찾기</button><span>|</span><button type="button" data-recovery="password">비밀번호 찾기</button><span>|</span><a href="signup.html">회원가입</a></nav>
<button class="auth-button auth-button--primary auth-button--full" type="submit">로그인</button>
<p id="auth-status" class="auth-status" role="status" hidden></p></form>
<a class="auth-close" href="index.html" aria-label="로그인 창 닫기"><img src="assets/auth/41da6.svg" alt=""></a></main>
<dialog id="recovery-dialog" class="auth-dialog"><h2>계정 찾기 안내</h2><p>계정 찾기는 인증 서버 연결 후 이용할 수 있습니다.</p><form method="dialog"><button class="auth-button auth-button--primary">확인</button></form></dialog>
</body></html>
