<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVIDENCE - 비밀번호 변경</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="account.css">
  <script src="navigation.js" defer></script>
  <script src="account.js" defer></script>
</head>
<body>
  <div class="account-shell">
    <header class="account-header">
      <a class="account-brand" href="index_home.html"><span class="account-brand__mark" aria-hidden="true"></span><span class="account-brand__name">EVIDENCE</span><span class="account-brand__detail">디지털 증거 플랫폼</span></a>
      <nav class="account-nav" aria-label="주 메뉴">
        <a href="Dashboard.html">대시보드</a><a href="evidence.html">증거 관리</a><a href="verification.html">검증</a><a href="report.html">보고서</a><a class="account-nav__mypage" href="mypage.html">My page</a>
      </nav>
    </header>
    <main class="account-main">
      <nav class="account-breadcrumb" aria-label="경로"><a href="mypage.html">My page</a><span>/</span><strong>비밀번호 변경</strong></nav>
      <section class="account-card" aria-labelledby="password-title">
        <div class="account-card__title"><span class="account-icon" aria-hidden="true">⌘</span><h1 id="password-title">비밀번호 변경</h1></div>
        <p class="account-card__description">현재 비밀번호를 확인한 뒤 새 비밀번호를 설정합니다.</p>
        <form id="password-change-form" class="account-form">
          <label class="account-field">현재 비밀번호<input name="current" type="password" required autocomplete="current-password" placeholder="현재 비밀번호를 입력하세요"></label>
          <label class="account-field">새 비밀번호<input name="next" type="password" required minlength="8" autocomplete="new-password" placeholder="새 비밀번호를 입력하세요"></label>
          <p class="account-help">영문, 숫자, 특수문자를 조합해 8자 이상 입력해 주세요.</p>
          <label class="account-field">새 비밀번호 확인<input name="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="새 비밀번호를 다시 입력하세요"></label>
          <div class="account-actions"><a class="account-button" href="mypage.html">취소</a><button class="account-button account-button--primary" type="submit">비밀번호 변경</button></div>
        </form>
        <p class="account-status" data-account-status role="status" hidden></p>
        <p class="account-demo-note">현재는 화면 시연용입니다. 입력한 비밀번호는 저장하거나 전송하지 않으며, 실제 변경은 인증 서버 연결 후 처리됩니다.</p>
      </section>
    </main>
  </div>
</body>
</html>
